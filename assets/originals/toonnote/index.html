<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToonNote Video</title>
  <meta name="description" content="ToonNote project video by Daye Kang.">
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    video {
      display: block;
      width: 100%;
      height: 100vh;

      background: #000;

</head>

  <video controls playsinline preload="metadata">

    Your browser does not support MP4 video playback.
  </video>
</body>
</html>
